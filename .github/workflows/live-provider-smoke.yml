name: Live provider smoke test (explicit opt-in)

on:
  workflow_dispatch:
    inputs:
      authorize_provider_call:
        description: "Authorize one real Planner → Executor → Reviewer → Reviser task; provider quota may be consumed"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  authorization-required:
    if: inputs.authorize_provider_call != true
    runs-on: ubuntu-latest
    steps:
      - name: Explain authorization gate
        run: echo "No provider call was made. Re-run manually with authorize_provider_call enabled."

  live-smoke:
    if: inputs.authorize_provider_call == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_FREE_MODELS: openrouter/free
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check required secret without revealing it
        shell: bash
        run: |
          if [[ -z "${OPENROUTER_API_KEY}" ]]; then
            echo "::error::Repository secret OPENROUTER_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned action
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # pinned action
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify configured provider without making a request
        run: python -m agent_team.cli --check-config

      - name: Run one live end-to-end task and emit metadata only
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          task = (
              "Return a compact JSON object with keys status and checks. "
              "Set status to ok and checks to an array of exactly three short strings. "
              "This is a connectivity smoke test; do not use tools or access external data."
          )
          try:
              run = subprocess.run(
                  [sys.executable, "-m", "agent_team.cli", task],
                  capture_output=True, text=True, timeout=240, check=False,
              )
          except subprocess.TimeoutExpired:
              summary = {
                  "ok": False, "return_code": None, "stages": [],
                  "total_duration_ms": None, "final_chars": 0,
                  "failure_type": "timeout",
              }
              print(json.dumps(summary, ensure_ascii=False, indent=2))
              with open("live-smoke-summary.json", "w", encoding="utf-8") as handle:
                  json.dump(summary, handle, ensure_ascii=False, indent=2)
              raise SystemExit(1)

          try:
              result = json.loads(run.stdout)
          except (json.JSONDecodeError, TypeError):
              result = {}

          trace = result.get("trace", []) if isinstance(result, dict) else []
          summary = {
              "ok": bool(run.returncode == 0 and result.get("ok") is True
                         and isinstance(result.get("final"), str) and result["final"].strip()
                         and len(trace) == 4
                         and all(event.get("status") == "success" for event in trace)),
              "return_code": run.returncode,
              "stages": [
                  {"stage": event.get("stage"), "status": event.get("status"),
                   "provider": event.get("provider"), "model": event.get("model")}
                  for event in trace
              ],
              "total_duration_ms": result.get("total_duration_ms") if isinstance(result, dict) else None,
              "final_chars": len(result.get("final", "")) if isinstance(result, dict) and isinstance(result.get("final"), str) else 0,
              "failure_type": (
                  (trace[-1].get("error_type") if trace else None)
                  or (result.get("failed_stage") if isinstance(result, dict) else None)
                  or ("provider_or_cli_error" if run.returncode else None)
              ) if run.returncode or not result.get("ok", False) else None,
          }
          # Never print raw model output, task text, stderr, or credentials.
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with open("live-smoke-summary.json", "w", encoding="utf-8") as handle:
              json.dump(summary, handle, ensure_ascii=False, indent=2)
          raise SystemExit(0 if summary["ok"] else 1)
          PY

      - name: Publish result in GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if [[ ! -f live-smoke-summary.json ]]; then
            {
              echo "## Live provider smoke test"
              echo
              echo "**Result:** No sanitized summary was produced."
              echo "Review the failed step status in this run; do not share raw logs or secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("live-smoke-summary.json", encoding="utf-8") as handle:
              summary = json.load(handle)
          print("## Live provider smoke test")
          print()
          print("**Result:** " + ("PASS" if summary.get("ok") is True else "FAIL"))
          print()
          print(chr(96) * 3 + "json")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print(chr(96) * 3)
          PY

      - name: Upload sanitized smoke summary
        if: always() && hashFiles('live-smoke-summary.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned action
        with:
          name: live-provider-smoke-summary
          path: live-smoke-summary.json
          if-no-files-found: error
          retention-days: 1
