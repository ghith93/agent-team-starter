name: One-time rc16 source restoration

on:
  push:
    branches:
      - bridge/api-write-smoke-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
      - name: Verify and restore source files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path("agent_team_starter_restore.zip")
          expected = "aaf02c67527745e281d287f122e115ddd5e97764c9ae9f9ee989bdc7cff9d7c0"
          assert archive.is_file(), "Archive missing"
          data = archive.read_bytes()
          assert hashlib.sha256(data).hexdigest() == expected, "Archive SHA-256 mismatch"
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "ZIP CRC check failed"
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and ".." not in p.parts, f"Unsafe archive path: {name}"
              z.extractall("/tmp/rc16-extracted")
          print("Archive hash, ZIP CRC and path checks passed.")
          PY
          SRC=/tmp/rc16-extracted/agent_team_starter_v0.9.1
          test -d "$SRC/agent_team"
          mkdir -p docs/recovered-workflows
          cp "$SRC/.github/workflows/security.yml" docs/recovered-workflows/security.yml
          rm -f "$SRC/.github/workflows/security.yml"
          cp -a "$SRC/." .
          rm -f agent_team_starter_restore.zip
          rm -f .github/workflows/restore-audit.yml .github/workflows/restore-source-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore verified v0.9.1-rc16 source tree"
          git push origin HEAD:bridge/api-write-smoke-test
