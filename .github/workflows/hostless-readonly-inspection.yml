name: Hostless read-only worker inspection

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Hostless worker name"
        required: true
        default: "agent-team-worker"
        type: string

permissions:
  contents: read

concurrency:
  group: hostless-readonly-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Read worker status, deployments, and runtime logs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect redacted Hostless diagnostics
        env:
          HOSTLESS_TOKEN: ${{ secrets.HOSTLESS_TOKEN }}
          HOSTLESS_WORKER: ${{ inputs.worker_name }}
        run: python3 scripts/hostless_readonly_inspect.py

      - name: Upload short-lived redacted report
        if: always() && hashFiles('hostless-report/report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hostless-readonly-report
          path: hostless-report/report.json
          if-no-files-found: error
          retention-days: 1
