name: Tests and security scans

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline regression and evaluator suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline release gates
        run: python run_tests.py
      - name: Compile Python sources
        run: python -m compileall -q agent_team evaluations tests
      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-test-reports
          path: evaluations/results/
          if-no-files-found: warn
          retention-days: 14

  python-security:
    name: Python SAST, secrets and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Prepare report directory
        run: mkdir -p security-reports
      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit semgrep detect-secrets
          python -m pip freeze > security-reports/scanner-versions.txt
      - name: Bandit Python security lint
        id: bandit
        continue-on-error: true
        run: bandit -r agent_team -f json -o security-reports/bandit.json
      - name: pip-audit dependencies
        id: pip_audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --format json --output security-reports/pip-audit.json
      - name: Semgrep Python rules and secrets
        id: semgrep
        continue-on-error: true
        run: semgrep scan --error --config p/python --config p/secrets --json --output security-reports/semgrep.json agent_team evaluations tests
      - name: detect-secrets baseline scan
        id: detect_secrets
        continue-on-error: true
        run: detect-secrets scan --all-files --exclude-files '(^|/)(\.git|\.venv|venv|security-reports)/' --exclude-lines '.*(https://user:pass@example\.com|http://user:secret@proxy\.example:8080|Prefer Colab.s .*GEMINI_API_KEY.*OPENROUTER_API_KEY).*' > security-reports/detect-secrets.json
      - name: Fail if detect-secrets found candidates
        id: detect_secrets_gate
        if: steps.detect_secrets.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PYSCAN'
          import json, sys
          with open('security-reports/detect-secrets.json', encoding='utf-8') as f:
              report = json.load(f)
          results = report.get('results', {})
          findings = {path: items for path, items in results.items() if items}
          print(json.dumps({'files_with_findings': len(findings), 'findings': findings}, indent=2))
          sys.exit(1 if findings else 0)
          PYSCAN
      - name: Enforce scan outcomes
        if: always()
        env:
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
          DETECT_SECRETS_OUTCOME: ${{ steps.detect_secrets.outcome }}
          DETECT_SECRETS_GATE_OUTCOME: ${{ steps.detect_secrets_gate.outcome }}
        run: |
          printf 'Bandit=%s\npip-audit=%s\nSemgrep=%s\ndetect-secrets=%s\ndetect-secrets-gate=%s\n' "$BANDIT_OUTCOME" "$PIP_AUDIT_OUTCOME" "$SEMGREP_OUTCOME" "$DETECT_SECRETS_OUTCOME" "$DETECT_SECRETS_GATE_OUTCOME" | tee security-reports/outcomes.txt
          test "$BANDIT_OUTCOME" = success && test "$PIP_AUDIT_OUTCOME" = success && test "$SEMGREP_OUTCOME" = success && test "$DETECT_SECRETS_OUTCOME" = success && test "$DETECT_SECRETS_GATE_OUTCOME" = success
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-security-reports
          path: security-reports/
          if-no-files-found: warn
          retention-days: 30

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history for secret detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository history and working tree
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"
