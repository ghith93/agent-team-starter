name: Scheduled multi-agent task (explicit opt-in)

on:
  # Weekly cadence. The job is skipped unless the repository variable below is explicitly enabled.
  schedule:
    - cron: "37 9 * * 2"

permissions:
  contents: read

concurrency:
  group: scheduled-multi-agent-task
  cancel-in-progress: false

jobs:
  run-scheduled-task:
    if: vars.ENABLE_SCHEDULED_AGENT_RUN == 'true' && vars.SCHEDULED_AGENT_TASK != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_FREE_MODELS: openrouter/free
      OPENROUTER_PLAN_MODELS: nvidia/nemotron-3-ultra-550b-a55b:free,openrouter/free
      OPENROUTER_DRAFT_MODELS: cohere/north-mini-code:free,openrouter/free
      OPENROUTER_REVIEW_MODELS: nvidia/nemotron-3-ultra-550b-a55b:free,openrouter/free
      TASK_INPUT: ${{ vars.SCHEDULED_AGENT_TASK }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one authorized scheduled agent-team task
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from agent_team.router import ProviderError, FreeFirstRouter, classify_http_error
          from agent_team.team import TeamExecutionError, run_team

          task = os.environ.get("TASK_INPUT", "").strip()
          if not task:
              print("SKIP: scheduled task is empty; no provider call was made.")
              sys.exit(0)
          if len(task) > 5000:
              print("FAIL: scheduled task exceeds the 5000-character limit.")
              sys.exit(1)
          if not os.environ.get("OPENROUTER_API_KEY", "").strip():
              print("FAIL: OPENROUTER_API_KEY secret is missing; no provider call was made.")
              sys.exit(1)

          try:
              result = run_team(task, router=FreeFirstRouter())
          except TeamExecutionError as exc:
              print("FAIL: agent team stopped at stage:", exc.stage)
              cause = exc.cause
              failure = {"ok": False, "failed_stage": exc.stage, "cause_type": type(cause).__name__}
              print("Cause type:", type(cause).__name__)
              if isinstance(cause, ProviderError):
                  if cause.status_code is not None:
                      category = classify_http_error(cause.status_code)
                      failure["provider_http_status"] = cause.status_code
                      failure["provider_error_category"] = category
                      print("Provider HTTP status:", cause.status_code)
                      print("Provider error category:", category)
                  else:
                      failure["provider_error_category"] = "network_or_protocol_or_empty_response"
                      print("Provider error category: network_or_protocol_or_empty_response")
              else:
                  print("Cause details suppressed to avoid leaking task or credential data.")
              Path("scheduled-agent-task-result.json").write_text(
                  json.dumps(failure, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              sys.exit(1)
          except Exception as exc:
              print("FAIL: agent team execution failed:", type(exc).__name__)
              Path("scheduled-agent-task-result.json").write_text(
                  json.dumps({"ok": False, "cause_type": type(exc).__name__}, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              sys.exit(1)

          expected = ["plan", "draft", "review", "revise"]
          trace = result.get("trace", [])
          if result.get("ok") is not True or [item.get("stage") for item in trace] != expected:
              print("FAIL: agent team did not complete all three expected stages.")
              sys.exit(1)
          if any(item.get("status") != "success" for item in trace):
              print("FAIL: one or more stages did not succeed.")
              sys.exit(1)
          if not isinstance(result.get("final"), str) or not result["final"].strip():
              print("FAIL: no final draft was produced.")
              sys.exit(1)

          report = {
              "ok": True,
              "final": result["final"],
              "plan": result.get("plan"),
              "draft": result.get("draft"),
              "review": result.get("review"),
              "revision": result.get("revision"),
              "trace": trace,
          }
          Path("scheduled-agent-task-result.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS: planner, executor, reviewer, and revision completed.")
          for item in trace:
              print("Stage:", item["stage"], "| duration_ms:", item.get("duration_ms", "unknown"))
          print("Task and model outputs are stored in a short-lived artifact, not in job logs.")
          PY

      - name: Upload scheduled task result for one day
        if: always() && hashFiles('scheduled-agent-task-result.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-agent-task-result
          path: scheduled-agent-task-result.json
          if-no-files-found: error
          retention-days: 1
