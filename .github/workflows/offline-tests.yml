name: Offline regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run release gates
        run: python run_tests.py
      - name: Compile Python sources
        run: python -m compileall -q agent_team evaluations tests
      - name: Validate deployment shell scripts
        run: |
          bash -n deploy/systemd/backup-queue.sh
          bash -n deploy/systemd/check-queue-health.sh
          bash -n deploy/systemd/run-queue-health-with-alert.sh
          bash -n deploy/systemd/test-queue-restore.sh
