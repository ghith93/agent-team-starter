name: OpenRouter live agent-team integration

on:
  push:
    branches:
      - bridge/api-write-smoke-test
    paths:
      - .github/workflows/openrouter-smoke.yml
      - agent_team/router.py
      - agent_team/team.py
      - tests/test_router.py
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-team-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_FREE_MODELS: openrouter/free
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run planner, executor, and reviewer through the free-model router
        run: |
          python - <<'PY'
          import os
          import sys
          from agent_team.router import FreeFirstRouter, ProviderError, classify_http_error
          from agent_team.team import TeamExecutionError, run_team

          if not os.environ.get("OPENROUTER_API_KEY", "").strip():
              print("FAIL: OpenRouter repository secret is missing or unavailable.")
              sys.exit(1)

          try:
              result = run_team(
                  "Create a concise checklist for safely testing a software feature without publishing it.",
                  router=FreeFirstRouter(),
              )
          except TeamExecutionError as exc:
              print("FAIL: Agent team failed at stage:", exc.stage)
              cause = exc.cause
              print("Cause type:", type(cause).__name__)
              if isinstance(cause, ProviderError):
                  if cause.status_code is not None:
                      print("Provider HTTP status:", cause.status_code)
                      print("Provider error category:", classify_http_error(cause.status_code))
                  else:
                      print("Provider error category: network_or_protocol")
              else:
                  print("Cause details suppressed to avoid leaking prompt or credential data.")
              sys.exit(1)
          except Exception as exc:
              print("FAIL: Agent team execution failed:", type(exc).__name__)
              sys.exit(1)

          expected = ["plan", "draft", "review"]
          trace = result.get("trace", [])
          if result.get("ok") is not True or [item.get("stage") for item in trace] != expected:
              print("FAIL: Agent team did not complete all three expected stages.")
              sys.exit(1)
          if any(item.get("status") != "success" for item in trace):
              print("FAIL: One or more agent stages did not succeed.")
              sys.exit(1)
          if not isinstance(result.get("final"), str) or not result["final"].strip():
              print("FAIL: Agent team produced no final draft.")
              sys.exit(1)

          print("PASS: planner, executor, and reviewer completed successfully.")
          for item in trace:
              print("Stage:", item["stage"], "| provider:", item.get("provider", "unknown"),
                    "| model:", item.get("model", "unknown"),
                    "| duration_ms:", item.get("duration_ms", "unknown"))
          print("Task and model outputs were not printed.")
          PY
