name: OpenRouter free-model smoke test

on:
  push:
    branches:
      - bridge/api-write-smoke-test
    paths:
      - .github/workflows/openrouter-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify one OpenRouter free-model response
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              print("FAIL: OPENROUTER_API_KEY repository secret is missing or unavailable.")
              sys.exit(1)

          payload = json.dumps({
              "model": "openrouter/free",
              "messages": [{"role": "user", "content": "Reply with exactly OK."}],
              "max_tokens": 8,
              "temperature": 0
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      print("FAIL: OpenRouter returned HTTP", response.status)
                      sys.exit(1)
                  data = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print("FAIL: OpenRouter returned HTTP", exc.code, "(response body suppressed)")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              print("FAIL: OpenRouter request did not complete:", type(exc).__name__)
              sys.exit(1)

          try:
              content = data["choices"][0]["message"]["content"]
          except (KeyError, IndexError, TypeError):
              print("FAIL: OpenRouter response had an unexpected shape.")
              sys.exit(1)

          if not isinstance(content, str) or not content.strip():
              print("FAIL: OpenRouter returned no text.")
              sys.exit(1)

          model = data.get("model", "unknown")
          print("PASS: OpenRouter returned a non-empty response.")
          print("Returned model:", str(model)[:120])
          print("Response content and credentials were not printed.")
          PY

  agent-team-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_FREE_MODELS: openrouter/free
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run planner, executor, and reviewer through the free-model router
        run: |
          python - <<'PY'
          import os
          import sys
          from agent_team.router import FreeFirstRouter
          from agent_team.team import run_team

          if not os.environ.get("OPENROUTER_API_KEY", "").strip():
              print("FAIL: OpenRouter repository secret is missing or unavailable.")
              sys.exit(1)

          try:
              result = run_team(
                  "Create a concise checklist for safely testing a software feature without publishing it.",
                  router=FreeFirstRouter(),
              )
          except Exception as exc:
              print("FAIL: Agent team execution failed:", type(exc).__name__)
              sys.exit(1)

          expected = ["plan", "draft", "review"]
          trace = result.get("trace", [])
          if result.get("ok") is not True or [item.get("stage") for item in trace] != expected:
              print("FAIL: Agent team did not complete all three expected stages.")
              sys.exit(1)
          if any(item.get("status") != "success" for item in trace):
              print("FAIL: One or more agent stages did not succeed.")
              sys.exit(1)
          if not isinstance(result.get("final"), str) or not result["final"].strip():
              print("FAIL: Agent team produced no final draft.")
              sys.exit(1)

          print("PASS: planner, executor, and reviewer completed successfully.")
          for item in trace:
              print("Stage:", item["stage"], "| provider:", item.get("provider", "unknown"),
                    "| model:", item.get("model", "unknown"),
                    "| duration_ms:", item.get("duration_ms", "unknown"))
          print("Task and model outputs were not printed.")
          PY
