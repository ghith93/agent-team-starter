name: Restore verified rc16 source archive

on:
  push:
    branches:
      - integration/restore-rc16-source

permissions:
  contents: write

jobs:
  restore:
    if: github.ref == 'refs/heads/integration/restore-rc16-source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/restore-rc16-source
          persist-credentials: true
      - name: Wait until all archive chunks are present
        id: chunks
        shell: bash
        run: |
          for part in transfer/rc16.zip.b64.part1 transfer/rc16.zip.b64.part2 transfer/rc16.zip.b64.part3 transfer/rc16.zip.b64.part4 transfer/rc16.zip.b64.part5 transfer/rc16.zip.b64.part6; do
            if [ ! -s "$part" ]; then
              echo "complete=false" >> "$GITHUB_OUTPUT"
              echo "Archive transfer incomplete; waiting for all six chunks."
              exit 0
            fi
          done
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Verify archive and restore source
        if: steps.chunks.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/rc16.zip.b64.part{1,2,3,4,5,6} | base64 --decode > /tmp/agent_team_starter_v0.9.1-rc16.zip
          echo "aaf02c67527745e281d287f122e115ddd5e97764c9ae9f9ee989bdc7cff9d7c0  /tmp/agent_team_starter_v0.9.1-rc16.zip" | sha256sum --check -
          python - <<'PY'
          import zipfile
          p = "/tmp/agent_team_starter_v0.9.1-rc16.zip"
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              for n in z.namelist():
                  normalized = n.replace("\\\\", "/")
                  if normalized.startswith("/") or ".." in normalized.split("/") or ":" in normalized.split("/")[0]:
                      raise SystemExit(f"Unsafe archive path: {n}")
                  if "__pycache__" in normalized.split("/") or normalized.endswith((".pyc", ".pyo")):
                      raise SystemExit(f"Unexpected runtime artifact: {n}")
              z.extractall("/tmp/rc16-extract")
          PY
          cp -a /tmp/rc16-extract/agent_team_starter_v0.9.1/. .
          rm -rf transfer
          rm -f .github/workflows/restore-rc16.yml
          cat >> README.md <<'EOF'

          ## Marketing and sales integration roadmap

          - [Implementation plan](docs/IMPLEMENTATION_PLAN_2026-10-23.md)
          - [Open-source integration radar](docs/OPEN_SOURCE_INTEGRATION_RADAR.md)
          - [Access boundaries and approval gates](docs/ACCESS_AND_AUTOMATION_BOUNDARIES.md)
          - [Execution status](docs/STATUS_2026-10-23.md)
          EOF
      - name: Run offline release gates
        if: steps.chunks.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python run_tests.py
          python -m compileall -q agent_team tests evaluations
          python evaluations/archive_audit.py /tmp/agent_team_starter_v0.9.1-rc16.zip
      - name: Commit restored source tree
        if: steps.chunks.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "restore verified Agent Team Starter rc16 source tree"
          git push origin HEAD:integration/restore-rc16-source
