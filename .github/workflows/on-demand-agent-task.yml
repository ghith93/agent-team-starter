name: On-demand agent task (GitHub-hosted runner)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One non-sensitive task to send to the configured free-model provider"
        required: true
        type: string
      authorize_provider_calls:
        description: "Explicitly authorize live OpenRouter calls; provider quota may be consumed"
        required: true
        default: false
        type: boolean
      enable_tools:
        description: "Enable bounded read-only repository and public-web tools; web use requires a trusted proxy secret"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: on-demand-agent-task-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-required:
    if: inputs.authorize_provider_calls != true
    runs-on: ubuntu-latest
    steps:
      - name: Explain why no task was run
        run: echo "No provider call was made. Re-run manually and enable authorize_provider_calls to execute the task."

  run-task:
    if: inputs.authorize_provider_calls == true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_FREE_MODELS: openrouter/free
      ENABLE_AGENT_TOOLS: ${{ inputs.enable_tools }}
      AGENT_TEAM_TRUSTED_EGRESS_PROXY: ${{ secrets.AGENT_TEAM_TRUSTED_EGRESS_PROXY }}
      TASK_INPUT: ${{ inputs.task }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one agent-team task without printing task or model output to logs
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from agent_team.router import ProviderError, FreeFirstRouter, classify_http_error
          from agent_team.team import TeamExecutionError, run_team
          from agent_team.tool_runtime import create_default_registry

          task = os.environ.get("TASK_INPUT", "").strip()
          if not task:
              print("FAIL: task input is empty.")
              sys.exit(1)
          if len(task) > 5000:
              print("FAIL: task input exceeds the 5000-character limit.")
              sys.exit(1)
          if not os.environ.get("OPENROUTER_API_KEY", "").strip():
              print("FAIL: OPENROUTER_API_KEY repository secret is missing or unavailable.")
              sys.exit(1)

          try:
              registry = create_default_registry(".") if os.environ.get("ENABLE_AGENT_TOOLS") == "true" else None
              result = run_team(task, router=FreeFirstRouter(), tool_registry=registry)
          except TeamExecutionError as exc:
              print("FAIL: agent team stopped at stage:", exc.stage)
              cause = exc.cause
              print("Cause type:", type(cause).__name__)
              if isinstance(cause, ProviderError):
                  if cause.status_code is not None:
                      print("Provider HTTP status:", cause.status_code)
                      print("Provider error category:", classify_http_error(cause.status_code))
                  else:
                      print("Provider error category: network_or_protocol_or_empty_response")
              else:
                  print("Cause details suppressed to avoid leaking task or credential data.")
              sys.exit(1)
          except Exception as exc:
              print("FAIL: agent team execution failed:", type(exc).__name__)
              sys.exit(1)

          expected = ["plan", "draft", "review", "revise"]
          trace = result.get("trace", [])
          if result.get("ok") is not True or [item.get("stage") for item in trace] != expected:
              print("FAIL: agent team did not complete all three expected stages.")
              sys.exit(1)
          if any(item.get("status") != "success" for item in trace):
              print("FAIL: one or more stages did not succeed.")
              sys.exit(1)
          if not isinstance(result.get("final"), str) or not result["final"].strip():
              print("FAIL: no final draft was produced.")
              sys.exit(1)

          # Keep the task and generated content out of Actions logs. The short-lived
          # artifact is accessible to repository users with Actions access.
          report = {
              "ok": True,
              "final": result["final"],
              "plan": result.get("plan"),
              "draft": result.get("draft"),
              "review": result.get("review"),
              "revision": result.get("revision"),
              "trace": trace,
          }
          Path("agent-task-result.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS: planner, executor, reviewer, and revision completed.")
          for item in trace:
              print("Stage:", item["stage"], "| duration_ms:", item.get("duration_ms", "unknown"))
          print("Task and model outputs are available only in the short-lived artifact, not in job logs.")
          PY

      - name: Upload task result for one day
        if: success() && hashFiles('agent-task-result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-task-result
          path: agent-task-result.json
          if-no-files-found: error
          retention-days: 1
